spring.application.name=portfolio-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

portfolio.admin.username=${PORTFOLIO_ADMIN_USERNAME:admin}
portfolio.admin.password=${PORTFOLIO_ADMIN_PASSWORD:admin123}

# JWT_SECRET sollte immer per Umgebungsvariable gesetzt werden (mind. 32 Zeichen).
# Der Default hier ist nur ein Entwicklungs-Fallback und nicht fuer den produktiven Einsatz gedacht.
jwt.secret=${JWT_SECRET:dev-only-fallback-secret-please-override-me-1234567890}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}