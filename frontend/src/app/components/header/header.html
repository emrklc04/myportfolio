<header class="header">
  <div class="header-container">
    <a routerLink="/" class="logo">
      <span>Emre Kilic</span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="primary-navigation"
      aria-label="Menü öffnen/schließen"
      (click)="toggleMenu()"
    >
      <span class="menu-icon" [class.open]="isMenuOpen" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <nav
      id="primary-navigation"
      class="navigation"
      [class.open]="isMenuOpen"
    >
      <a
        routerLink="/"
        [class.active]="isProjectsActive"
        (click)="goToProjects($event); closeMenu()"
      >
        My Projects
      </a>

      <a
        href="#about"
        [class.active]="isAboutActive"
        (click)="closeMenu()"
      >
        Über mich
      </a>

      <a
        routerLink="/admin"
        routerLinkActive="active"
        class="admin-link"
        (click)="closeMenu()"
      >
        <span class="admin-icon" aria-hidden="true">
          ⚙
        </span>

        <span>Adminbereich</span>
      </a>
    </nav>
  </div>
</header>
