<header class="header">
  <div class="header-container">
    <a routerLink="/" class="logo">
      <span>Emre Kilic</span>
    </a>

    <nav class="navigation">
      <a
        routerLink="/"
        [class.active]="isProjectsActive"
        (click)="goToProjects($event)"
      >
        My Projects
      </a>

      <a
        href="#about"
        [class.active]="isAboutActive"
      >
        Über mich
      </a>

      <a
        routerLink="/admin"
        routerLinkActive="active"
        class="admin-link"
      >
        <span class="admin-icon" aria-hidden="true">
          ⚙
        </span>

        <span>Adminbereich</span>
      </a>
    </nav>
  </div>
</header>
